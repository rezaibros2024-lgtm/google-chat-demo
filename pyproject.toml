[project]
name = "marketing-team"
version = "0.1.0"
description = "A one-person marketing team: orchestrator + specialist Claude agents"
requires-python = ">=3.10"
dependencies = ["anthropic>=2.13", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
marketing = "marketing_team.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["marketing_team*"]

[tool.setuptools.package-data]
marketing_team = ["knowledge/*.md"]
